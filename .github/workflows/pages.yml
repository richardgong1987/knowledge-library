name: Publish Knowledge Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Test tiny shop example
        run: node --test system-design/microservices/examples/shop-lab.test.mjs
      - name: Verify LeetCode algorithm taxonomy
        run: node --test algorithms/check-catalog.test.mjs
      - name: Test AI mathematics examples
        run: python3 -m unittest discover -s ai-mathematics/examples -p 'test_*.py'
      - name: Verify AI mathematics curriculum
        run: python3 ai-mathematics/check_curriculum.py
      - name: Exercise every AI lab demonstration
        run: python3 ai-mathematics/examples/delivery_ml_lab.py all > /dev/null
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - name: Show Quarto version
        run: quarto --version
      - name: Render website
        run: quarto render
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
