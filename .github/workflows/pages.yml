name: Publish Knowledge Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Test tiny shop example
        run: node --test system-design/microservices/examples/shop-lab.test.mjs
      - name: Verify LeetCode algorithm taxonomy
        run: node --test algorithms/check-catalog.test.mjs
      - name: Verify every algorithms lesson (structure, worked formulas, code taken from its lab)
        run: node --test algorithms/check-depth.test.mjs
      - name: Install Java 25 for the algorithm labs
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Run every algorithm lab (Java, SQL and Bash) and require OK
        run: node --test algorithms/check-labs.test.mjs
      - name: Test AI mathematics examples
        run: python3 -m unittest discover -s ai-mathematics/examples -p 'test_*.py'
      - name: Verify AI mathematics curriculum
        run: python3 ai-mathematics/check_curriculum.py
      - name: Exercise every AI lab demonstration
        run: python3 ai-mathematics/examples/delivery_ml_lab.py all > /dev/null
      - name: Verify advanced system-design lessons
        run: node --test system-design/interviews/check-curriculum.test.cjs
      - name: Install and build NestJS interview lab
        working-directory: system-design/interviews/lab
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Test advanced NestJS algorithms and HTTP adapter
        working-directory: system-design/interviews/lab
        run: npm test
      - name: Verify the four Java page snippets
        run: python3 programming-languages/check_examples.py
      - name: Install Go 1.27 for the Go labs
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: Install Python 3.14 for the Python labs
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install .NET 10 for the C# labs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Ubuntu's own package: the SWI-Prolog PPA does not install on the ubuntu-26.04 runner.
      # The labs are written on SWI-Prolog 10 and must also pass on this older release.
      - name: Install SWI-Prolog for the Prolog labs
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version
      - name: Install the TypeScript compiler for the TypeScript labs
        run: npm ci --no-audit --no-fund --prefix programming-languages/typescript/labs
      - name: Verify every language chapter and run its lab
        run: node --test programming-languages/check-languages.test.mjs
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Compile and run all 16 tiny Rust chapter examples
        run: python3 programming-languages/rust/check_curriculum.py
      - name: Test custom Rust attribute macro and run its application
        run: |
          cargo +1.100.0 test --manifest-path programming-languages/rust/examples/Cargo.toml --workspace
          cargo +1.100.0 run --manifest-path programming-languages/rust/examples/Cargo.toml -p attribute-demo
      - name: Test standalone financial mathematics lab
        run: python3 -m unittest discover -s finance/examples -p 'test_*.py'
      - name: Verify 28 finance lessons have symbol definitions and worked numbers
        run: python3 finance/check_curriculum.py
      - name: Verify DevOps book lessons
        run: node --test devops/check-book.test.mjs
      - name: Test the CI/CD example application
        run: node --test devops/ci-cd/examples/lemonade-stand/
      - name: Run the Ansible lab twice and prove the second run changes nothing
        working-directory: devops/ansible/examples
        run: |
          pipx install ansible-core
          ansible-playbook site.yml rolling-update.yml --syntax-check
          ansible-playbook site.yml -e lab_root="$RUNNER_TEMP/lab"
          ansible-playbook site.yml -e lab_root="$RUNNER_TEMP/lab" | tee "$RUNNER_TEMP/second.log"
          if grep -E 'changed=[1-9]' "$RUNNER_TEMP/second.log"; then exit 1; fi
          ansible-playbook rolling-update.yml -e lab_root="$RUNNER_TEMP/lab" -e lemonade_version=1.1.0
          ansible-playbook vault-demo.yml --vault-password-file secrets/demo-vault-password.txt -e lab_root="$RUNNER_TEMP/lab"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Apply the local Terraform example and prove the second plan is empty
        working-directory: devops/terraform/examples
        env:
          CHECKPOINT_DISABLE: 1
        run: |
          terraform fmt -check -recursive
          cd 01-local
          terraform init -input=false
          terraform apply -input=false -auto-approve
          terraform plan -input=false -detailed-exitcode
          terraform destroy -input=false -auto-approve
          cd ../03-module
          terraform init -input=false
          terraform validate
      - name: Verify the mathematical puzzle curriculum and notation explanations
        run: python3 mathematics/mathematical-puzzles/check_curriculum.py
      - name: Run the original mathematical-puzzle example tests
        run: python3 -m unittest discover -s mathematics/mathematical-puzzles/examples -p 'test_*.py'
      - name: Verify operating systems, compilers and quantum curriculum
        run: python3 operating-systems/check_curriculum.py
      - name: Test minimal computing foundations lab
        run: python3 -m unittest discover -s operating-systems/examples -p 'test_*.py'
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - name: Show Quarto version
        run: quarto --version
      - name: Render website
        run: quarto render
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
