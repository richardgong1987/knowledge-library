apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lemonade-orders
  namespace: lemonade
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: order-logger
  namespace: lemonade
spec:
  containers:
    - name: logger
      image: busybox:1.37.0
      command: ["sh", "-c", "echo \"order at $(date)\" >> /data/orders.log; sleep 3600"]
      volumeMounts:
        - name: orders
          mountPath: /data
  volumes:
    - name: orders
      persistentVolumeClaim:
        claimName: lemonade-orders
