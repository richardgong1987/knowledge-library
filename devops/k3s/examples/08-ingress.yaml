apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lemonade-web
  namespace: lemonade
spec:
  ingressClassName: traefik
  rules:
    - host: lemonade.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lemonade-web
                port:
                  number: 80
