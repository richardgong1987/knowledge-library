apiVersion: v1
kind: Secret
metadata:
  name: lemonade-payment
  namespace: lemonade
type: Opaque
stringData:
  PAYMENT_API_KEY: demo-key-123
---
apiVersion: v1
kind: Pod
metadata:
  name: cashier
  namespace: lemonade
spec:
  containers:
    - name: cashier
      image: busybox:1.37.0
      command: ["sh", "-c", "echo key length: ${#PAYMENT_API_KEY}; sleep 3600"]
      env:
        - name: PAYMENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: lemonade-payment
              key: PAYMENT_API_KEY
