apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-sales-report
  namespace: lemonade
spec:
  schedule: "0 18 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.37.0
              command: ["sh", "-c", "echo sales report for $(date +%F)"]
