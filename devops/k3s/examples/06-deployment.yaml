apiVersion: apps/v1
kind: Deployment
metadata:
  name: lemonade-web
  namespace: lemonade
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lemonade
  template:
    metadata:
      labels:
        app: lemonade
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30.5-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: menu
              mountPath: /usr/share/nginx/html
      volumes:
        - name: menu
          configMap:
            name: lemonade-menu
