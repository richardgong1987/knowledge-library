apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: lemonade
spec:
  clusterIP: None
  selector:
    app: ledger
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: lemonade
spec:
  serviceName: ledger
  replicas: 2
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
        - name: ledger
          image: busybox:1.37.0
          command: ["sh", "-c", "echo I am $HOSTNAME >> /books/owner.txt; sleep 3600"]
          volumeMounts:
            - name: books
              mountPath: /books
  volumeClaimTemplates:
    - metadata:
        name: books
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
