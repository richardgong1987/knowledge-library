# Lesson 06's Deployment plus probes and resources (lesson 11).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lemonade-web
  namespace: lemonade
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lemonade
  template:
    metadata:
      labels:
        app: lemonade
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30.5-alpine
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: menu
              mountPath: /usr/share/nginx/html
      volumes:
        - name: menu
          configMap:
            name: lemonade-menu
