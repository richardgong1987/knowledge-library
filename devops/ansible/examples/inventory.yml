# ansible_connection: local runs every "host" on this laptop (no SSH needed).
# Delete that line to manage real servers at the ansible_host addresses.
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    web:
      hosts:
        web1: { ansible_host: 192.0.2.11 }
        web2: { ansible_host: 192.0.2.12 }
    db:
      hosts:
        db1: { ansible_host: 192.0.2.21 }
    prod:
      children:
        web:
        db:
