# Usage: ansible-playbook rolling-update.yml -e lemonade_version=1.1.0
- name: Upgrade the web servers one at a time
  hosts: web
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  pre_tasks:
    - name: Create the load balancer folder
      ansible.builtin.file: { path: "{{ lab_root }}/lb", state: directory }
      delegate_to: localhost
      run_once: true
    - name: Take this server out of the load balancer
      ansible.builtin.file: { path: "{{ lab_root }}/lb/{{ inventory_hostname }}.off", state: touch }
      delegate_to: localhost
  roles:
    - lemonade_web
  post_tasks:
    - name: Wait until the menu shows the new version
      ansible.builtin.wait_for:
        path: "{{ lab_root }}/{{ inventory_hostname }}/site/index.html"
        search_regex: "version {{ lemonade_version }}"
        timeout: 10
    - name: Put this server back into the load balancer
      ansible.builtin.file: { path: "{{ lab_root }}/lb/{{ inventory_hostname }}.off", state: absent }
      delegate_to: localhost
