- name: Create the nginx and site folders
  ansible.builtin.file:
    path: "{{ lemonade_root }}/{{ item }}"
    state: directory
  loop: [nginx, site]

- name: Render the nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ lemonade_root }}/nginx/lemonade.conf"
  notify: Reload nginx

- name: Render the menu page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ lemonade_root }}/site/index.html"
  notify: Reload nginx
